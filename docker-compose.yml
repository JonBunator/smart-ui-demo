services:
  smart-ui-demo:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - src/.env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - bridge-network

  database:
    image: postgres:latest
    env_file:
      - src/.env
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 2s
      retries: 20
    restart: unless-stopped
    networks:
      - bridge-network

  prisma-studio:
    build:
      context: .
      dockerfile: prisma-studio/Dockerfile
    env_file:
      - src/.env
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "5555:5555"
    restart: unless-stopped
    networks:
      - bridge-network

networks:
  bridge-network:
    driver: bridge